<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AU Phone - Lockscreen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="lockscreen">
      <!-- Status bar -->
      <div class="status-bar">
        <span class="carrier">Telkomsel</span>
        <span class="icons">📶 🔋 87%</span>
      </div>

      <!-- Jam dan tanggal -->
      <div class="clock-area">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">Senin, 1 Januari 2024</div>
      </div>

      <!-- Tombol bawah -->
      <div class="bottom-buttons">
        <button id="camera-btn" class="round-btn" aria-label="Kamera">📷</button>
        <button id="emergency-btn" class="round-btn emergency" aria-label="Telepon Darurat">🚨</button>
      </div>

      <!-- Petunjuk geser -->
      <div class="swipe-hint">Geser ke atas untuk membuka</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
