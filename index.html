<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AU Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">

    <!-- ===== HOME SCREEN ===== -->
    <div class="screen home-screen" id="home-screen">
      <div class="home-status">
        <span>Telkomsel</span>
        <span>📶 🔋 87%</span>
      </div>

      <div class="app-grid">
        <button class="app" data-app="chat">
          <span class="app-icon">💬</span>
          <span class="app-name">Chat</span>
        </button>
        <button class="app" data-app="galeri">
          <span class="app-icon">🖼️</span>
          <span class="app-name">Galeri</span>
        </button>
        <button class="app" data-app="catatan">
          <span class="app-icon">📝</span>
          <span class="app-name">Catatan</span>
        </button>
        <button class="app" data-app="telepon">
          <span class="app-icon">📞</span>
          <span class="app-name">Telepon</span>
        </button>
        <button class="app" data-app="kamera">
          <span class="app-icon">📷</span>
          <span class="app-name">Kamera</span>
        </button>
        <button class="app" data-app="pengaturan">
          <span class="app-icon">⚙️</span>
          <span class="app-name">Pengaturan</span>
        </button>
      </div>

      <div class="home-hint">Geser ke bawah untuk kembali ke lockscreen</div>
    </div>

    <!-- ===== LOCKSCREEN ===== -->
    <div class="screen lockscreen" id="lockscreen">
      <div class="status-bar">
        <span class="carrier">Telkomsel</span>
        <span class="icons">📶 🔋 87%</span>
      </div>

      <div class="clock-area">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">Senin, 1 Januari 2024</div>
      </div>

      <div class="bottom-buttons">
        <button id="emergency-btn" class="round-btn emergency" aria-label="Telepon Darurat">
          <img src="telepon.png" alt="Telepon" class="btn-icon" onerror="this.style.display='none'">
        </button>
        <button id="camera-btn-lockscreen" class="round-btn" aria-label="Kamera">
          <img src="kamera.png" alt="Kamera" class="btn-icon" onerror="this.style.display='none'">
        </button>
      </div>

      <div class="swipe-hint">Geser ke atas untuk membuka</div>
    </div>

    <!-- ===== APLIKASI CHAT ===== -->
    <div class="screen app-screen" id="chat-screen">
      <div class="chat-header">
        <button class="back-btn" data-target="chat-screen">←</button>
        <h2 id="chat-title">Pesan</h2>
      </div>
      <div class="chat-content">
        <div id="chat-list-view" class="chat-list">
          <div class="chat-item" data-contact="Rian" data-avatar="👦">
            <div class="avatar">👦</div>
            <div class="chat-info">
              <div class="chat-name">Rian</div>
              <div class="chat-preview">Halo, kamu di mana?</div>
            </div>
          </div>
          <div class="chat-item" data-contact="Dita" data-avatar="👧">
            <div class="avatar">👧</div>
            <div class="chat-info">
              <div class="chat-name">Dita</div>
              <div class="chat-preview">Jangan lupa bawa buku ya!</div>
            </div>
          </div>
        </div>
        <div id="chat-room-view" class="chat-room" style="display: none;">
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ketik pesan...">
            <button id="send-btn">Kirim</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== APLIKASI KAMERA ===== -->
    <div class="screen app-screen" id="camera-screen">
      <div class="camera-view">
        <video id="camera-viewfinder" autoplay playsinline muted></video>
        <div id="flash-overlay" class="flash-effect"></div>
        
        <div class="camera-controls">
          <button class="back-btn" data-target="camera-screen" style="color: white; font-size: 28px; z-index: 20;">✕</button>
          <button id="shutter-btn" class="shutter-btn"></button>
          <div style="width: 28px;"></div>
        </div>
      </div>
    </div>

    <!-- ===== APLIKASI GALERI (DENGAN MENU TITIK TIGA) ===== -->
    <div class="screen app-screen" id="gallery-screen">
      <div class="chat-header">
        <button class="back-btn" data-target="gallery-screen">←</button>
        <h2>Galeri</h2>
        <!-- Tombol Titik Tiga (Menu) -->
        <button id="menu-gallery-btn" style="margin-left: auto; background: none; border: none; font-size: 24px; color: #007aff; cursor: pointer; font-weight: bold; padding: 0 10px;">⋮</button>
      </div>
      
      <div class="gallery-content" id="gallery-grid">
        <!-- Foto akan muncul di sini -->
      </div>

      <!-- Action Bar (Muncul saat mode Pilih aktif) -->
      <div id="gallery-action-bar" class="action-bar" style="display: none;">
        <button id="cancel-select-btn">Batal</button>
        <span id="selected-count" style="font-weight: bold; color: #333;">0 dipilih</span>
        <button id="delete-selected-btn" style="color: #ff3b30; font-weight: bold;">Hapus</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
