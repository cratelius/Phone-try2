<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AU Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">

    <!-- ===== HOME SCREEN ===== -->
    <div class="screen home-screen" id="home-screen">
      <div class="ios-status-bar">
        <span class="ios-time" id="ios-time">08:55</span>
        <span class="ios-icons">📶 🔋</span>
      </div>

      <div class="app-grid">
        <div class="app" data-app="spotify">
          <div class="app-icon"><img src="icons/spotify.jpg" alt="Spotify"></div>
          <span class="app-name">Spotify</span>
        </div>
        <div class="app" data-app="instagram">
          <div class="app-icon"><img src="icons/instagram.jpg" alt="Instagram"></div>
          <span class="app-name">Instagram</span>
        </div>
        <div class="app" data-app="youtube">
          <div class="app-icon"><img src="icons/youtube.jpg" alt="YouTube"></div>
          <span class="app-name">YouTube</span>
        </div>
        <div class="app" data-app="tiktok">
          <div class="app-icon"><img src="icons/tiktok.jpg" alt="TikTok"></div>
          <span class="app-name">TikTok</span>
          <div class="badge">246</div>
        </div>
        <div class="app" data-app="zoom">
          <div class="app-icon"><img src="icons/zoom.jpg" alt="Zoom"></div>
          <span class="app-name">Zoom</span>
        </div>
        <div class="app" data-app="chat">
          <div class="app-icon"><img src="icons/pesan.jpg" alt="Pesan"></div>
          <span class="app-name">Pesan</span>
        </div>
        <div class="app" data-app="blockblast">
          <div class="app-icon"><img src="icons/blockblast.jpg" alt="Block Blast"></div>
          <span class="app-name">Block Blast</span>
        </div>
        <div class="app" data-app="galeri">
          <div class="app-icon"><img src="icons/galeri.jpg" alt="Photos"></div>
          <span class="app-name">Photos</span>
        </div>
      </div>

      <div class="page-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>

      <div class="dock">
        <div class="app" data-app="kamera">
          <div class="app-icon"><img src="icons/kamera.jpg" alt="Kamera"></div>
        </div>
        <div class="app" data-app="telepon">
          <div class="app-icon"><img src="icons/telepon.jpg" alt="Telepon"></div>
        </div>
        <div class="app" data-app="whatsapp">
          <div class="app-icon"><img src="icons/whatsapp.jpg" alt="WhatsApp"></div>
          <div class="badge">59</div>
        </div>
      </div>

      <div class="home-hint">Geser ke bawah untuk kembali ke lockscreen</div>
    </div>

    <!-- ===== LOCKSCREEN (TIDAK DIUBAH) ===== -->
    <div class="screen lockscreen" id="lockscreen">
      <div class="status-bar">
        <span class="carrier">Telkomsel</span>
        <span class="icons">📶 🔋 87%</span>
      </div>

      <div class="clock-area">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">Senin, 1 Januari 2024</div>
      </div>

      <div class="bottom-buttons">
        <button id="emergency-btn" class="round-btn emergency" aria-label="Telepon Darurat">
          <img src="telepon.png" alt="Telepon" class="btn-icon" onerror="this.outerHTML='📞'">
        </button>
        <button id="camera-btn-lockscreen" class="round-btn" aria-label="Kamera">
          <img src="kamera.png" alt="Kamera" class="btn-icon" onerror="this.outerHTML='📷'">
        </button>
      </div>

      <div class="swipe-hint">Geser ke atas untuk membuka</div>
    </div>

    <!-- ===== APLIKASI CHAT ===== -->
    <div class="screen app-screen" id="chat-screen">
      <div class="chat-header">
        <button class="back-btn" data-target="chat-screen">←</button>
        <h2 id="chat-title">Pesan</h2>
      </div>
      <div class="chat-content">
        <div id="chat-list-view" class="chat-list">
          <div class="chat-item" data-contact="Rian" data-avatar="👦">
            <div class="avatar">👦</div>
            <div class="chat-info">
              <div class="chat-name">Rian</div>
              <div class="chat-preview">Halo, kamu di mana?</div>
            </div>
          </div>
          <div class="chat-item" data-contact="Dita" data-avatar="👧">
            <div class="avatar">👧</div>
            <div class="chat-info">
              <div class="chat-name">Dita</div>
              <div class="chat-preview">Jangan lupa bawa buku ya!</div>
            </div>
          </div>
        </div>
        <div id="chat-room-view" class="chat-room" style="display: none;">
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ketik pesan...">
            <button id="send-btn">Kirim</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== APLIKASI KAMERA ===== -->
    <div class="screen app-screen camera-screen" id="camera-screen">
      <div class="camera-view">
        <video id="camera-viewfinder" autoplay playsinline muted></video>
        <div id="flash-overlay" class="flash-effect"></div>
        
        <button class="camera-close-btn" onclick="tutupKamera()">✕</button>

        <div class="camera-controls">
          <button id="shutter-btn" class="shutter-btn"></button>
        </div>
      </div>
    </div>

    <!-- ===== APLIKASI GALERI ===== -->
    <div class="screen app-screen" id="gallery-screen">
      <div class="chat-header">
        <button class="back-btn" data-target="gallery-screen">←</button>
        <h2>Galeri</h2>
        <button id="menu-gallery-btn" style="margin-left: auto; background: none; border: none; font-size: 24px; color: #007aff; cursor: pointer; font-weight: bold; padding: 0 10px;">⋮</button>
      </div>

      <div class="gallery-content" id="gallery-grid"></div>

      <div id="gallery-action-bar" class="action-bar" style="display: none;">
        <button id="cancel-select-btn">Batal</button>
        <span id="selected-count" style="font-weight: bold; color: #333;">0 dipilih</span>
        <button id="delete-selected-btn" style="color: #ff3b30; font-weight: bold;">Hapus</button>
      </div>
    </div>

    <!-- ===== LAYAR LIHAT FOTO (PREVIEW) ===== -->
    <div class="screen app-screen" id="photo-view-screen" style="background: #000; z-index: 10;">
      <div class="chat-header" style="background: rgba(0,0,0,0.8); border: none; position: absolute; top: 0; width: 100%; z-index: 12; display: flex; justify-content: space-between;">
        <button class="back-btn" id="close-photo-btn" style="color: white;">←</button>
        <button id="delete-preview-btn" style="background: none; border: none; color: #ff3b30; font-size: 16px; font-weight: bold; cursor: pointer; padding-right: 10px;">Hapus</button>
      </div>
      <img id="full-photo" src="" alt="Foto" style="width: 100%; height: 100%; object-fit: contain;">
    </div>

    <!-- ===== APLIKASI BLOCK BLAST ===== -->
    <div class="screen app-screen" id="blockblast-screen">
      <div class="chat-header" style="background: #1a1a2e; border-bottom: none; color: white;">
        <button class="back-btn" data-target="blockblast-screen" style="color: white;">←</button>
        <h2 style="color: white; font-weight: bold;">Block Blast</h2>
        <span id="bb-score" style="margin-left: auto; font-size: 18px; font-weight: bold; padding-right: 10px;">0</span>
      </div>

      <div class="bb-container">
        <canvas id="game-board" width="320" height="320"></canvas>
        <div class="bb-blocks-area">
          <canvas id="block-1" class="bb-block" width="80" height="80"></canvas>
          <canvas id="block-2" class="bb-block" width="80" height="80"></canvas>
          <canvas id="block-3" class="bb-block" width="80" height="80"></canvas>
        </div>
        <button id="restart-bb" style="margin-top: 20px; padding: 10px 20px; border-radius: 20px; border: none; background: #ff3b30; color: white; font-weight: bold; cursor: pointer;">Ulangi Game</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
